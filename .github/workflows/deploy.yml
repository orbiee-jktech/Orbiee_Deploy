name: Deploy Orbiee

on:
  repository_dispatch:
    types: [trigger-orbiee]

# Minimum permissions required by this workflow.
permissions:
  contents: read

env:
  GCP_PROJECT: retail-jkommerce-poc
  GCP_REGION: us-central1
  ARTIFACT_REGISTRY: us-central1-docker.pkg.dev/retail-jkommerce-poc/orbiee

jobs:

  # ============================================================
  # 1. SETUP / VALIDATION
  # ============================================================
  setup:
    name: Validate Deployment Request
    runs-on: ubuntu-latest

    outputs:
      repository: ${{ steps.validate.outputs.repository }}
      ref: ${{ steps.validate.outputs.ref }}
      sha: ${{ steps.validate.outputs.sha }}
      environment: ${{ steps.config.outputs.environment }}

      backend_service: ${{ steps.config.outputs.backend_service }}
      worker_service: ${{ steps.config.outputs.worker_service }}
      emotion_service: ${{ steps.config.outputs.emotion_service }}

      backend_image: ${{ steps.config.outputs.backend_image }}
      emotion_image: ${{ steps.config.outputs.emotion_image }}
      impressions_image: ${{ steps.config.outputs.impressions_image }}
      preferences_image: ${{ steps.config.outputs.preferences_image }}
      type_affinity_image: ${{ steps.config.outputs.type_affinity_image }}
      item_popularity_image: ${{ steps.config.outputs.item_popularity_image }}

      frontend_service: ${{ steps.config.outputs.frontend_service }}
      frontend_image: ${{ steps.config.outputs.frontend_image }}

    steps:
      - name: Validate deployment payload
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          REPOSITORY="${{ github.event.client_payload.repository }}"
          REF="${{ github.event.client_payload.ref }}"
          SHA="${{ github.event.client_payload.sha }}"

          echo "Repository : ${REPOSITORY}"
          echo "Ref        : ${REF}"
          echo "SHA        : ${SHA}"

          if [[ -z "${REPOSITORY}" ]]; then
            echo "ERROR: repository is missing."
            exit 1
          fi

          if [[ -z "${REF}" ]]; then
            echo "ERROR: ref is missing."
            exit 1
          fi

          if [[ -z "${SHA}" ]]; then
            echo "ERROR: sha is missing."
            echo "Deployment must use an immutable commit SHA."
            exit 1
          fi

          # Only allow the known source repositories.
          case "${REPOSITORY}" in
            orbiee-jktech/Orbiee_Backend)
              echo "Recognized backend repository."
              ;;
            orbiee-jktech/Orbiee_FrontEnd)
              echo "Recognized frontend repository."
              ;;
            *)
              echo "ERROR: Unauthorized repository: ${REPOSITORY}"
              exit 1
              ;;
          esac

          # Validate SHA format.
          if [[ ! "${SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "ERROR: Invalid commit SHA."
            exit 1
          fi

          echo "repository=${REPOSITORY}" >> "${GITHUB_OUTPUT}"
          echo "ref=${REF}" >> "${GITHUB_OUTPUT}"
          echo "sha=${SHA}" >> "${GITHUB_OUTPUT}"

      - name: Determine deployment configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail

          REPOSITORY="${{ steps.validate.outputs.repository }}"
          REF="${{ steps.validate.outputs.ref }}"

          echo "Determining configuration..."
          echo "Repository: ${REPOSITORY}"
          echo "Ref: ${REF}"

          # ------------------------------------------------------
          # BACKEND
          # ------------------------------------------------------
          if [[ "${REPOSITORY}" == "orbiee-jktech/Orbiee_Backend" ]]; then

            case "${REF}" in

              rearchitecture|feature/emotion_detection)
                ENVIRONMENT="dev"

                BACKEND_SERVICE="orbiee-backend-dev"
                WORKER_SERVICE="orbiee-worker-dev"
                EMOTION_SERVICE="orbiee-emotion-detection-dev"

                BACKEND_IMAGE="orbiee-backend-dev"
                EMOTION_IMAGE="orbiee-emotion-detection-dev"
                IMPRESSIONS_IMAGE="orbiee-impressions-analytics-dev"
                PREFERENCES_IMAGE="orbiee-preferences-dev"
                TYPE_AFFINITY_IMAGE="orbiee-type-affinity-refresh-dev"
                ITEM_POPULARITY_IMAGE="orbiee-item-popularity-refresh-dev"
                ;;

              feature/SearchRetrieval)
                ENVIRONMENT="dev1"

                BACKEND_SERVICE="orbiee-backend-dev1"
                WORKER_SERVICE="orbiee-worker-dev1"
                EMOTION_SERVICE="orbiee-emotion-detection-dev1"

                BACKEND_IMAGE="orbiee-backend-dev1"
                EMOTION_IMAGE="orbiee-emotion-detection-dev1"
                IMPRESSIONS_IMAGE="orbiee-impressions-analytics-dev1"
                PREFERENCES_IMAGE="orbiee-preferences-dev1"
                TYPE_AFFINITY_IMAGE="orbiee-type-affinity-refresh-dev1"
                ITEM_POPULARITY_IMAGE="orbiee-item-popularity-refresh-dev1"
                ;;

              feature/*)
                ENVIRONMENT="dev"

                BACKEND_SERVICE="orbiee-backend-dev"
                WORKER_SERVICE="orbiee-worker-dev"
                EMOTION_SERVICE="orbiee-emotion-detection-dev"

                BACKEND_IMAGE="orbiee-backend-dev"
                EMOTION_IMAGE="orbiee-emotion-detection-dev"
                IMPRESSIONS_IMAGE="orbiee-impressions-analytics-dev"
                PREFERENCES_IMAGE="orbiee-preferences-dev"
                TYPE_AFFINITY_IMAGE="orbiee-type-affinity-refresh-dev"
                ITEM_POPULARITY_IMAGE="orbiee-item-popularity-refresh-dev"
                ;;

              rearchitecture_demo)
                ENVIRONMENT="demo"

                BACKEND_SERVICE="orbiee-backend"
                WORKER_SERVICE="orbiee-worker"
                EMOTION_SERVICE="orbiee-emotion-detection"

                BACKEND_IMAGE="orbiee-backend"
                EMOTION_IMAGE="orbiee-emotion-detection"
                IMPRESSIONS_IMAGE="orbiee-impressions-analytics"
                PREFERENCES_IMAGE="orbiee-preferences"
                TYPE_AFFINITY_IMAGE="orbiee-type-affinity-refresh"
                ITEM_POPULARITY_IMAGE="orbiee-item-popularity-refresh"
                ;;

              *)
                echo "ERROR: Unsupported backend ref: ${REF}"
                exit 1
                ;;
            esac

            echo "environment=${ENVIRONMENT}" >> "${GITHUB_OUTPUT}"

            echo "backend_service=${BACKEND_SERVICE}" >> "${GITHUB_OUTPUT}"
            echo "worker_service=${WORKER_SERVICE}" >> "${GITHUB_OUTPUT}"
            echo "emotion_service=${EMOTION_SERVICE}" >> "${GITHUB_OUTPUT}"

            echo "backend_image=${BACKEND_IMAGE}" >> "${GITHUB_OUTPUT}"
            echo "emotion_image=${EMOTION_IMAGE}" >> "${GITHUB_OUTPUT}"
            echo "impressions_image=${IMPRESSIONS_IMAGE}" >> "${GITHUB_OUTPUT}"
            echo "preferences_image=${PREFERENCES_IMAGE}" >> "${GITHUB_OUTPUT}"
            echo "type_affinity_image=${TYPE_AFFINITY_IMAGE}" >> "${GITHUB_OUTPUT}"
            echo "item_popularity_image=${ITEM_POPULARITY_IMAGE}" >> "${GITHUB_OUTPUT}"

          # ------------------------------------------------------
          # FRONTEND
          # ------------------------------------------------------
          elif [[ "${REPOSITORY}" == "orbiee-jktech/Orbiee_FrontEnd" ]]; then

            case "${REF}" in

              dev|rearchitecture)
                ENVIRONMENT="dev"
                FRONTEND_SERVICE="orbiee-dev"
                FRONTEND_IMAGE="orbiee-dev"
                ;;

              search-testing)
                ENVIRONMENT="dev1"
                FRONTEND_SERVICE="orbiee-dev1"
                FRONTEND_IMAGE="orbiee-dev1"
                ;;

              demov1|rearchitecture_demo)
                ENVIRONMENT="demo"
                FRONTEND_SERVICE="orbiee"
                FRONTEND_IMAGE="orbiee-demo"
                ;;

              *)
                echo "ERROR: Unsupported frontend ref: ${REF}"
                exit 1
                ;;
            esac

            echo "environment=${ENVIRONMENT}" >> "${GITHUB_OUTPUT}"

            echo "frontend_service=${FRONTEND_SERVICE}" >> "${GITHUB_OUTPUT}"
            echo "frontend_image=${FRONTEND_IMAGE}" >> "${GITHUB_OUTPUT}"

          fi

          echo "Deployment configuration:"
          cat "${GITHUB_OUTPUT}"


  # ============================================================
  # 2. BUILD + SECURITY SCAN BACKEND
  # ============================================================
  build-backend:
    name: Build and Security Scan Backend
    needs: setup
    if: needs.setup.outputs.repository == 'orbiee-jktech/Orbiee_Backend'
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:

      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.setup.outputs.repository }}
          ref: ${{ needs.setup.outputs.sha }}
          token: ${{ secrets.PRIVATETOKENPULL }}
          fetch-depth: 0

      - name: Verify exact commit
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_SHA="${{ needs.setup.outputs.sha }}"
          ACTUAL_SHA="$(git rev-parse HEAD)"

          echo "Expected SHA: ${EXPECTED_SHA}"
          echo "Actual SHA:   ${ACTUAL_SHA}"

          if [[ "${ACTUAL_SHA}" != "${EXPECTED_SHA}" ]]; then
            echo "ERROR: Checked out commit does not match requested SHA."
            exit 1
          fi

          echo "Exact commit verified successfully."

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SAKEY }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Generate immutable image tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          TIMESTAMP="$(date -u +'%Y%m%d-%H%M%S')"

          IMAGE_TAG="${TIMESTAMP}-${SHORT_SHA}"

          echo "Image tag: ${IMAGE_TAG}"
          echo "image_tag=${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"

      # --------------------------------------------------------
      # BUILD ALL BACKEND IMAGES
      # --------------------------------------------------------
      - name: Build backend image
        run: |
          docker build \
            -f apps/orbiee_core/Dockerfile \
            -t "${{ env.ARTIFACT_REGISTRY }}/${{ needs.setup.outputs.backend_image }}:${{ steps.meta.outputs.image_tag }}" \
            .

      - name: Inspect installed Python packages
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ env.ARTIFACT_REGISTRY }}/${{ needs.setup.outputs.backend_image }}:${{ steps.meta.outputs.image_tag }}"

          echo "=== Python version ==="
          docker run --rm "${IMAGE}" python --version

          echo "=== msgpack ==="
          docker run --rm "${IMAGE}" python -m pip show msgpack || true

          echo "=== setuptools ==="
          docker run --rm "${IMAGE}" python -m pip show setuptools || true

          echo "=== pip ==="
          docker run --rm "${IMAGE}" python -m pip show pip || true

          echo "=== Relevant installed packages ==="
          docker run --rm "${IMAGE}" python -m pip list | grep -Ei 'msgpack|setuptools|pip' || true

      - name: Build impressions analytics image
        run: |
          docker build \
            -f apps/impressions_analytics_job/Dockerfile \
            -t "${{ env.ARTIFACT_REGISTRY }}/${{ needs.setup.outputs.impressions_image }}:${{ steps.meta.outputs.image_tag }}" \
            .

      - name: Build preferences image
        run: |
          docker build \
            -f apps/affinity_learning_service/Dockerfile \
            -t "${{ env.ARTIFACT_REGISTRY }}/${{ needs.setup.outputs.preferences_image }}:${{ steps.meta.outputs.image_tag }}" \
            .

      - name: Build type affinity refresh image
        run: |
          docker build \
            -f apps/type_affinity_refresh_job/Dockerfile \
            -t "${{ env.ARTIFACT_REGISTRY }}/${{ needs.setup.outputs.type_affinity_image }}:${{ steps.meta.outputs.image_tag }}" \
            .

      - name: Build item popularity refresh image
        run: |
          docker build \
            -f apps/item_popularity_refresh_job/Dockerfile \
            -t "${{ env.ARTIFACT_REGISTRY }}/${{ needs.setup.outputs.item_popularity_image }}:${{ steps.meta.outputs.image_tag }}" \
            .

      - name: Build emotion detection image
        if: github.event.client_payload.deploy_emotion_detection == 'yes'
        run: |
          docker build \
            -f apps/emotion_detection_service/Dockerfile \
            -t "${{ env.ARTIFACT_REGISTRY }}/${{ needs.setup.outputs.emotion_image }}:${{ steps.meta.outputs.image_tag }}" \
            .

      # --------------------------------------------------------
      # SECURITY SCANNING
      #
      # Important:
      # Images are NOT pushed until all security scans pass.
      # --------------------------------------------------------
      - name: Create security evidence directory
        run: |
          mkdir -p security-evidence

      - name: Check all Python package metadata
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ env.ARTIFACT_REGISTRY }}/${{ needs.setup.outputs.backend_image }}:${{ steps.meta.outputs.image_tag }}"

          echo "=================================================="
          echo "Checking Python package metadata"
          echo "Image: ${IMAGE}"
          echo "=================================================="

          docker run --rm "${IMAGE}" sh -c '
            echo "=== Python ==="
            which python || true
            python --version || true

            echo
            echo "=== Python sys.path ==="
            python - <<'"'"'PY'"'"'
          import sys
          for p in sys.path:
              print(p)
          PY

            echo
            echo "=== msgpack import ==="
            python - <<'"'"'PY'"'"'
          import msgpack
          print("version :", msgpack.__version__)
          print("file    :", msgpack.__file__)
          PY

            echo
            echo "=== setuptools import ==="
            python - <<'"'"'PY'"'
          import setuptools
          print("version :", setuptools.__version__)
          print("file    :", setuptools.__file__)
          PY

            echo
            echo "=== ALL msgpack metadata ==="
            find / \
              -type d \
              \( -name "msgpack-*.dist-info" -o -name "msgpack-*.egg-info" \) \
              -print 2>/dev/null | sort

            echo
            echo "=== ALL setuptools metadata ==="
            find / \
              -type d \
              \( -name "setuptools-*.dist-info" -o -name "setuptools-*.egg-info" \) \
              -print 2>/dev/null | sort

            echo
            echo "=== ALL msgpack files ==="
            find / \
              -type f \
              -path "*msgpack*" \
              -print 2>/dev/null | head -200

            echo
            echo "=== ALL setuptools files ==="
            find / \
              -type f \
              -path "*setuptools*" \
              -print 2>/dev/null | head -200

            echo
            echo "=== pip metadata ==="
            python -m pip show msgpack setuptools || true

            echo
            echo "=== pip list ==="
            python -m pip list | grep -Ei "msgpack|setuptools" || true

            echo
            echo "=== importlib.metadata ==="
            python - <<'"'"'PY'"'
          from importlib.metadata import distributions

          for d in distributions():
              name = (d.metadata.get("Name") or "").lower()
              if name in {"msgpack", "setuptools"}:
                  print(
                      "name=", d.metadata.get("Name"),
                      "version=", d.version,
                      "path=", d._path
                  )
          PY
          '


      - name: Scan backend images with Trivy
        shell: bash
        run: |
          set -euo pipefail

          IMAGES=(
            "${{ env.ARTIFACT_REGISTRY }}/${{ needs.setup.outputs.backend_image }}:${{ steps.meta.outputs.image_tag }}"
          )

          if [[ "${{ github.event.client_payload.deploy_emotion_detection }}" == "yes" ]]; then
            IMAGES+=(
              "${{ env.ARTIFACT_REGISTRY }}/${{ needs.setup.outputs.emotion_image }}:${{ steps.meta.outputs.image_tag }}"
            )
          fi

          for IMAGE in "${IMAGES[@]}"; do

            SAFE_NAME="$(echo "${IMAGE}" | sed 's#[/:]#_#g')"

            echo "=================================================="
            echo "Scanning: ${IMAGE}"
            echo "=================================================="

            # Verify the exact image being scanned
            docker image inspect "${IMAGE}" \
              --format='IMAGE_ID={{.Id}} CREATED={{.Created}} TAGS={{.RepoTags}}'

            echo "Package versions inside image:"

            docker run --rm "${IMAGE}" \
              python -c "import msgpack, setuptools; print('msgpack=', msgpack.__version__); print('setuptools=', setuptools.__version__)"

            # Full vulnerability report
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "${PWD}/security-evidence:/work" \
              aquasec/trivy:0.74.0 \
              image \
              --format json \
              --output "/work/${SAFE_NAME}-trivy.json" \
              "${IMAGE}"

            # --------------------------------------------------------
            # DEBUG: Show exactly what Trivy detected for Python
            # packages, including the package path.
            # --------------------------------------------------------
            echo
            echo "=================================================="
            echo "Trivy Python findings"
            echo "=================================================="

            jq '
              .Results[]?.Vulnerabilities[]?
              | select(
                  (.PkgName == "msgpack") or
                  (.PkgName == "setuptools")
                )
              | {
                  Target,
                  PkgName,
                  InstalledVersion,
                  FixedVersion,
                  PkgPath,
                  VulnerabilityID,
                  Severity
                }
            ' "security-evidence/${SAFE_NAME}-trivy.json" || true

            # Security gate
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.74.0 \
              image \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              "${IMAGE}"

            # SBOM
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "${PWD}/security-evidence:/work" \
              aquasec/trivy:0.74.0 \
              image \
              --format cyclonedx \
              --output "/work/${SAFE_NAME}-sbom.json" \
              "${IMAGE}"

          done

      - name: Create backend security metadata
        run: |
          cat > security-evidence/deployment-metadata.txt <<EOF
          Product: Orbiee
          Component: Backend
          Repository: ${{ needs.setup.outputs.repository }}
          Ref: ${{ needs.setup.outputs.ref }}
          Commit SHA: ${{ needs.setup.outputs.sha }}
          Image Tag: ${{ steps.meta.outputs.image_tag }}
          Build Time UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          GCP Project: ${{ env.GCP_PROJECT }}
          GCP Region: ${{ env.GCP_REGION }}
          Artifact Registry: ${{ env.ARTIFACT_REGISTRY }}
          Security Scan: Trivy
          Security Gate: HIGH/CRITICAL with available fixes
          EOF

      - name: Upload backend security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbiee-backend-security-${{ steps.meta.outputs.image_tag }}
          path: security-evidence/
          retention-days: 30

      # --------------------------------------------------------
      # PUSH ONLY AFTER SECURITY GATE PASSES
      # --------------------------------------------------------
      - name: Push backend images
        shell: bash
        run: |
          set -euo pipefail

          IMAGES=(
            "${{ env.ARTIFACT_REGISTRY }}/${{ needs.setup.outputs.backend_image }}:${{ steps.meta.outputs.image_tag }}"
            "${{ env.ARTIFACT_REGISTRY }}/${{ needs.setup.outputs.impressions_image }}:${{ steps.meta.outputs.image_tag }}"
            "${{ env.ARTIFACT_REGISTRY }}/${{ needs.setup.outputs.preferences_image }}:${{ steps.meta.outputs.image_tag }}"
            "${{ env.ARTIFACT_REGISTRY }}/${{ needs.setup.outputs.type_affinity_image }}:${{ steps.meta.outputs.image_tag }}"
            "${{ env.ARTIFACT_REGISTRY }}/${{ needs.setup.outputs.item_popularity_image }}:${{ steps.meta.outputs.image_tag }}"
          )

          if [[ "${{ github.event.client_payload.deploy_emotion_detection }}" == "yes" ]]; then
            IMAGES+=(
              "${{ env.ARTIFACT_REGISTRY }}/${{ needs.setup.outputs.emotion_image }}:${{ steps.meta.outputs.image_tag }}"
            )
          fi

          for IMAGE in "${IMAGES[@]}"; do
            echo "Pushing ${IMAGE}"
            docker push "${IMAGE}"
          done

      - name: Record Artifact Registry image digests
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="deployment-manifest.txt"

          {
            echo "Product: Orbiee"
            echo "Repository: ${{ needs.setup.outputs.repository }}"
            echo "Ref: ${{ needs.setup.outputs.ref }}"
            echo "Commit SHA: ${{ needs.setup.outputs.sha }}"
            echo "Image Tag: ${{ steps.meta.outputs.image_tag }}"
            echo "Build Time UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo ""
            echo "Images:"
          } > "${MANIFEST}"

          IMAGES=(
            "${{ env.ARTIFACT_REGISTRY }}/${{ needs.setup.outputs.backend_image }}:${{ steps.meta.outputs.image_tag }}"
            "${{ env.ARTIFACT_REGISTRY }}/${{ needs.setup.outputs.impressions_image }}:${{ steps.meta.outputs.image_tag }}"
            "${{ env.ARTIFACT_REGISTRY }}/${{ needs.setup.outputs.preferences_image }}:${{ steps.meta.outputs.image_tag }}"
            "${{ env.ARTIFACT_REGISTRY }}/${{ needs.setup.outputs.type_affinity_image }}:${{ steps.meta.outputs.image_tag }}"
            "${{ env.ARTIFACT_REGISTRY }}/${{ needs.setup.outputs.item_popularity_image }}:${{ steps.meta.outputs.image_tag }}"
          )

          if [[ "${{ github.event.client_payload.deploy_emotion_detection }}" == "yes" ]]; then
            IMAGES+=(
              "${{ env.ARTIFACT_REGISTRY }}/${{ needs.setup.outputs.emotion_image }}:${{ steps.meta.outputs.image_tag }}"
            )
          fi

          for IMAGE in "${IMAGES[@]}"; do

            DIGEST=""

            for ATTEMPT in 1 2 3 4 5; do
              DIGEST="$(gcloud artifacts docker images describe \
                "${IMAGE}" \
                --format='value(image_summary.digest)' 2>/dev/null || true)"

              if [[ -n "${DIGEST}" ]]; then
                break
              fi

              echo "Waiting for Artifact Registry metadata..."
              sleep 3
            done

            if [[ -z "${DIGEST}" ]]; then
              echo "ERROR: Could not retrieve digest for ${IMAGE}"
              exit 1
            fi

            echo "${IMAGE}@${DIGEST}" >> "${MANIFEST}"
          done

          cat "${MANIFEST}"

      - name: Upload deployment manifest
        uses: actions/upload-artifact@v4
        with:
          name: orbiee-backend-deployment-manifest-${{ steps.meta.outputs.image_tag }}
          path: deployment-manifest.txt
          retention-days: 90


  # ============================================================
  # 3. DEPLOY BACKEND
  # ============================================================
  deploy-backend:
    name: Deploy Backend to Cloud Run
    needs:
      - setup
      - build-backend

    if: needs.setup.outputs.repository == 'orbiee-jktech/Orbiee_Backend'
    runs-on: ubuntu-latest

    steps:

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SAKEY }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy backend service
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ env.ARTIFACT_REGISTRY }}/${{ needs.setup.outputs.backend_image }}:${{ needs.build-backend.outputs.image_tag }}"

          gcloud run deploy "${{ needs.setup.outputs.backend_service }}" \
            --image="${IMAGE}" \
            --region="${{ env.GCP_REGION }}" \
            --project="${{ env.GCP_PROJECT }}" \
            --memory=2Gi \
            --timeout=3600 \
            --set-secrets="DB_CONFIG=DB_CONFIG:latest,API_KEYS_JSON=API_KEYS_JSON:latest,REDIS_URL=REDIS_URL:latest,ORBIEE_SEARCH_BACKEND=ORBIEE_SEARCH_BACKEND:latest" \
            --set-env-vars="ORBIEE_GCP_PROJECT=${{ env.GCP_PROJECT }},ORBIEE_DEBUG=false,VERTEX_PROJECT=${{ env.GCP_PROJECT }},BRANCH=${{ needs.setup.outputs.ref }},ENVIRONMENT=${{ needs.setup.outputs.environment }}"

      - name: Deploy worker service
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ env.ARTIFACT_REGISTRY }}/${{ needs.setup.outputs.backend_image }}:${{ needs.build-backend.outputs.image_tag }}"

          gcloud run deploy "${{ needs.setup.outputs.worker_service }}" \
            --image="${IMAGE}" \
            --region="${{ env.GCP_REGION }}" \
            --project="${{ env.GCP_PROJECT }}" \
            --memory=2Gi \
            --timeout=3600 \
            --min=1 \
            --max=1 \
            --command=python \
            --args="-m,orbiee.workers.session_worker" \
            --set-secrets="DB_CONFIG=DB_CONFIG:latest,API_KEYS_JSON=API_KEYS_JSON:latest,REDIS_URL=REDIS_URL:latest,ORBIEE_SEARCH_BACKEND=ORBIEE_SEARCH_BACKEND:latest" \
            --set-env-vars="ORBIEE_GCP_PROJECT=${{ env.GCP_PROJECT }},ORBIEE_DEBUG=false,VERTEX_PROJECT=${{ env.GCP_PROJECT }},BRANCH=${{ needs.setup.outputs.ref }},ENVIRONMENT=${{ needs.setup.outputs.environment }}"

      - name: Allow internal compute service account to invoke worker
        shell: bash
        run: |
          gcloud run services add-iam-policy-binding \
            "${{ needs.setup.outputs.worker_service }}" \
            --region="${{ env.GCP_REGION }}" \
            --project="${{ env.GCP_PROJECT }}" \
            --member="serviceAccount:218142584790-compute@developer.gserviceaccount.com" \
            --role="roles/run.invoker"

      - name: Deploy emotion detection service
        if: github.event.client_payload.deploy_emotion_detection == 'yes'
        shell: bash
        run: |
          set -euo pipefail

