  # ============================================================
  # 4. BUILD + SECURITY SCAN FRONTEND
  # ============================================================
  build-frontend:
    name: Build and Security Scan Frontend
    needs: setup
    if: needs.setup.outputs.repository == 'orbiee-jktech/Orbiee_FrontEnd'
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:

      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.setup.outputs.repository }}
          ref: ${{ needs.setup.outputs.sha }}
          token: ${{ secrets.PRIVATETOKENPULL }}
          fetch-depth: 0

      - name: Verify exact commit
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_SHA="${{ needs.setup.outputs.sha }}"
          ACTUAL_SHA="$(git rev-parse HEAD)"

          echo "Expected SHA: ${EXPECTED_SHA}"
          echo "Actual SHA:   ${ACTUAL_SHA}"

          if [[ "${ACTUAL_SHA}" != "${EXPECTED_SHA}" ]]; then
            echo "ERROR: Checked out commit does not match requested SHA."
            exit 1
          fi

          echo "Exact commit verified successfully."

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SAKEY }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Generate immutable image tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          TIMESTAMP="$(date -u +'%Y%m%d-%H%M%S')"

          IMAGE_TAG="${TIMESTAMP}-${SHORT_SHA}"

          echo "Image tag: ${IMAGE_TAG}"
          echo "image_tag=${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"

      # --------------------------------------------------------
      # FRONTEND BUILD
      #
      # Current behavior is preserved:
      # REACT_APP_ENV=dev
      #
      # IMPORTANT:
      # Values in React REACT_APP_* variables are public and
      # must never contain credentials or secrets.
      # --------------------------------------------------------
      - name: Build frontend image
        run: |
          docker build \
            --build-arg REACT_APP_ENV=dev \
            -t "${{ env.ARTIFACT_REGISTRY }}/${{ needs.setup.outputs.frontend_image }}:${{ steps.meta.outputs.image_tag }}" \
            .

      # --------------------------------------------------------
      # FRONTEND SECURITY SCAN
      # --------------------------------------------------------
      - name: Create security evidence directory
        run: |
          mkdir -p security-evidence

      - name: Scan frontend image with Trivy
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ env.ARTIFACT_REGISTRY }}/${{ needs.setup.outputs.frontend_image }}:${{ steps.meta.outputs.image_tag }}"

          SAFE_NAME="$(echo "${IMAGE}" | sed 's#[/:]#_#g')"

          echo "Scanning ${IMAGE}"

          # Full vulnerability report.
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${PWD}/security-evidence:/work" \
            aquasec/trivy:latest \
            image \
            --format json \
            --output "/work/${SAFE_NAME}-trivy.json" \
            "${IMAGE}"

          # Security gate.
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest \
            image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            "${IMAGE}"

          # SBOM.
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${PWD}/security-evidence:/work" \
            aquasec/trivy:latest \
            image \
            --format cyclonedx \
            --output "/work/${SAFE_NAME}-sbom.json" \
            "${IMAGE}"

      - name: Create frontend security metadata
        run: |
          cat > security-evidence/deployment-metadata.txt <<EOF
          Product: Orbiee
          Component: Frontend
          Repository: ${{ needs.setup.outputs.repository }}
          Ref: ${{ needs.setup.outputs.ref }}
          Commit SHA: ${{ needs.setup.outputs.sha }}
          Image Tag: ${{ steps.meta.outputs.image_tag }}
          Build Time UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          GCP Project: ${{ env.GCP_PROJECT }}
          GCP Region: ${{ env.GCP_REGION }}
          Artifact Registry: ${{ env.ARTIFACT_REGISTRY }}
          Security Scan: Trivy
          Security Gate: HIGH/CRITICAL with available fixes
          EOF

      - name: Upload frontend security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbiee-frontend-security-${{ steps.meta.outputs.image_tag }}
          path: security-evidence/
          retention-days: 30

      # --------------------------------------------------------
      # PUSH ONLY AFTER SECURITY GATE PASSES
      # --------------------------------------------------------
      - name: Push frontend image
        run: |
          docker push \
            "${{ env.ARTIFACT_REGISTRY }}/${{ needs.setup.outputs.frontend_image }}:${{ steps.meta.outputs.image_tag }}"

      - name: Record Artifact Registry image digest
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ env.ARTIFACT_REGISTRY }}/${{ needs.setup.outputs.frontend_image }}:${{ steps.meta.outputs.image_tag }}"

          DIGEST=""

          for ATTEMPT in 1 2 3 4 5; do
            DIGEST="$(gcloud artifacts docker images describe \
              "${IMAGE}" \
              --format='value(image_summary.digest)' 2>/dev/null || true)"

            if [[ -n "${DIGEST}" ]]; then
              break
            fi

            echo "Waiting for Artifact Registry metadata..."
            sleep 3
          done

          if [[ -z "${DIGEST}" ]]; then
            echo "ERROR: Could not retrieve image digest."
            exit 1
          fi

          cat > deployment-manifest.txt <<EOF
          Product: Orbiee
          Component: Frontend
          Repository: ${{ needs.setup.outputs.repository }}
          Ref: ${{ needs.setup.outputs.ref }}
          Commit SHA: ${{ needs.setup.outputs.sha }}
          Image Tag: ${{ steps.meta.outputs.image_tag }}
          Image: ${IMAGE}
          Digest: ${DIGEST}
          Build Time UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF

          cat deployment-manifest.txt

      - name: Upload deployment manifest
        uses: actions/upload-artifact@v4
        with:
          name: orbiee-frontend-deployment-manifest-${{ steps.meta.outputs.image_tag }}
          path: deployment-manifest.txt
          retention-days: 90


  # ============================================================
  # 5. DEPLOY FRONTEND
  # ============================================================
  deploy-frontend:
    name: Deploy Frontend to Cloud Run
    needs:
      - setup
      - build-frontend

    if: needs.setup.outputs.repository == 'orbiee-jktech/Orbiee_FrontEnd'
    runs-on: ubuntu-latest

    steps:

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SAKEY }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy frontend
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ env.ARTIFACT_REGISTRY }}/${{ needs.setup.outputs.frontend_image }}:${{ needs.build-frontend.outputs.image_tag }}"

          gcloud run deploy "${{ needs.setup.outputs.frontend_service }}" \
            --image="${IMAGE}" \
            --region="${{ env.GCP_REGION }}" \
            --project="${{ env.GCP_PROJECT }}" \
            --allow-unauthenticated