name: Deploy Orbiee

on:
  repository_dispatch:
    types: [trigger-orbiee]

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.env.outputs.branch }}
      region: ${{ steps.env.outputs.region }}
      artifact_registry_region: ${{ steps.env.outputs.artifact_registry_region }}
      artifact_registry_repo: ${{ steps.env.outputs.artifact_registry_repo }}
      cloud_run_service: ${{ steps.env.outputs.cloud_run_service }}
      cloud_worker_service: ${{ steps.env.outputs.cloud_worker_service }}
      emotion_detection_service: ${{ steps.env.outputs.emotion_detection_service }}
      image_name: ${{ steps.env.outputs.image_name }}
      emotion_detection_image_name: ${{ steps.env.outputs.emotion_detection_image_name }}
      impressions_image_name: ${{ steps.env.outputs.impressions_image_name }}
      preferences_image_name: ${{ steps.env.outputs.preferences_image_name }}
      type_affinity_image_name: ${{ steps.env.outputs.type_affinity_image_name }}
      item_popularity_image_name: ${{ steps.env.outputs.item_popularity_image_name }}
      environment: ${{ steps.env.outputs.environment }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repository }}
          ref: ${{ github.event.client_payload.ref }}
          token: ${{ secrets.PRIVATETOKENPULL }}

      - name: Determine Environment
        id: env
        run: |
          BRANCH="${{ github.event.client_payload.ref }}"
          REPO="${{ github.event.client_payload.repository }}"

          if [[ "$REPO" == "orbiee-jktech/Orbiee_Backend" ]]; then

            case "$BRANCH" in
              rearchitecture|feature/emotion_detection)
                CLOUD_RUN_SERVICE="orbiee-backend-dev"
                IMAGE_NAME="orbiee-backend-dev"
                EMOTION_DETECTION_IMAGE_NAME="orbiee-emotion-detection-dev"
                IMPRESSIONS_IMAGE_NAME="orbiee-impressions-analytics-dev"
                PREFERENCES_IMAGE_NAME="orbiee-preferences-dev"
                TYPE_AFFINITY_IMAGE_NAME="orbiee-type-affinity-refresh-dev"
                ITEM_POPULARITY_IMAGE_NAME="orbiee-item-popularity-refresh-dev"
                CLOUD_WORKER_SERVICE="orbiee-worker-dev"
                EMOTION_DETECTION_SERVICE="orbiee-emotion-detection-dev"
                ENVIRONMENT="dev"
                ;;

              feature/SearchRetrieval)
                CLOUD_RUN_SERVICE="orbiee-backend-dev1"
                IMAGE_NAME="orbiee-backend-dev1"
                EMOTION_DETECTION_IMAGE_NAME="orbiee-emotion-detection-dev"
                IMPRESSIONS_IMAGE_NAME="orbiee-impressions-analytics-dev1"
                PREFERENCES_IMAGE_NAME="orbiee-preferences-dev1"
                TYPE_AFFINITY_IMAGE_NAME="orbiee-type-affinity-refresh-dev1"
                ITEM_POPULARITY_IMAGE_NAME="orbiee-item-popularity-refresh-dev1"
                CLOUD_WORKER_SERVICE="orbiee-worker-dev1"
                EMOTION_DETECTION_SERVICE="orbiee-emotion-detection-dev"
                ENVIRONMENT="dev"
                ;;

              feature/*)
                CLOUD_RUN_SERVICE="orbiee-backend-dev"
                IMAGE_NAME="orbiee-backend-dev"
                EMOTION_DETECTION_IMAGE_NAME="orbiee-emotion-detection-dev"
                IMPRESSIONS_IMAGE_NAME="orbiee-impressions-analytics-dev"
                PREFERENCES_IMAGE_NAME="orbiee-preferences-dev"
                TYPE_AFFINITY_IMAGE_NAME="orbiee-type-affinity-refresh-dev"
                ITEM_POPULARITY_IMAGE_NAME="orbiee-item-popularity-refresh-dev"
                CLOUD_WORKER_SERVICE="orbiee-worker-dev"
                EMOTION_DETECTION_SERVICE="orbiee-emotion-detection-dev"
                ENVIRONMENT="dev"
                ;;
                
              rearchitecture_demo)
                CLOUD_RUN_SERVICE="orbiee-backend"
                IMAGE_NAME="orbiee-backend"
                EMOTION_DETECTION_IMAGE_NAME="orbiee-emotion-detection"
                IMPRESSIONS_IMAGE_NAME="orbiee-impressions-analytics"
                PREFERENCES_IMAGE_NAME="orbiee-preferences"
                TYPE_AFFINITY_IMAGE_NAME="orbiee-type-affinity-refresh"
                ITEM_POPULARITY_IMAGE_NAME="orbiee-item-popularity-refresh"
                CLOUD_WORKER_SERVICE="orbiee-worker"
                EMOTION_DETECTION_SERVICE="orbiee-emotion-detection"
                ENVIRONMENT="demo"
                ;;
                
              *)
                echo "Unsupported backend branch: $BRANCH"
                exit 1
                ;;
            esac

          else

            case "$BRANCH" in
              dev|rearchitecture)
                CLOUD_RUN_SERVICE="orbiee-dev"
                IMAGE_NAME="orbiee-dev"
                ;;

              search-testing)
                CLOUD_RUN_SERVICE="orbiee-dev1"
                IMAGE_NAME="orbiee-dev1"
                ;;
                
              demov1|rearchitecture_demo)
                CLOUD_RUN_SERVICE="orbiee"
                IMAGE_NAME="orbiee-demo"
                ;;
                
              *)
                echo "Unsupported frontend branch: $BRANCH"
                exit 1
                ;;
            esac

          fi

          REGION="us-central1"
          ARTIFACT_REGISTRY_REGION="us-central1"
          ARTIFACT_REGISTRY_REPO="orbiee"

          echo "branch=$BRANCH"                                         >> $GITHUB_OUTPUT
          echo "region=$REGION"                                         >> $GITHUB_OUTPUT
          echo "artifact_registry_region=$ARTIFACT_REGISTRY_REGION"    >> $GITHUB_OUTPUT
          echo "artifact_registry_repo=$ARTIFACT_REGISTRY_REPO"        >> $GITHUB_OUTPUT
          echo "cloud_run_service=$CLOUD_RUN_SERVICE"                   >> $GITHUB_OUTPUT
          echo "cloud_worker_service=$CLOUD_WORKER_SERVICE"             >> $GITHUB_OUTPUT
          echo "image_name=$IMAGE_NAME"                                 >> $GITHUB_OUTPUT
          echo "emotion_detection_service=$EMOTION_DETECTION_SERVICE"   >> $GITHUB_OUTPUT
          echo "emotion_detection_image_name=$EMOTION_DETECTION_IMAGE_NAME"  >> $GITHUB_OUTPUT
          echo "impressions_image_name=$IMPRESSIONS_IMAGE_NAME"         >> $GITHUB_OUTPUT
          echo "preferences_image_name=$PREFERENCES_IMAGE_NAME"         >> $GITHUB_OUTPUT
          echo "type_affinity_image_name=$TYPE_AFFINITY_IMAGE_NAME"     >> $GITHUB_OUTPUT
          echo "item_popularity_image_name=$ITEM_POPULARITY_IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "environment=$ENVIRONMENT"                               >> $GITHUB_OUTPUT

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SAKEY }}"

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: retail-jkommerce-poc

  deploy-backend:
    if: ${{ github.event.client_payload.repository == 'orbiee-jktech/Orbiee_Backend' }}
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repository }}
          ref: ${{ github.event.client_payload.ref }}
          token: ${{ secrets.PRIVATETOKENPULL }}
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SAKEY }}"

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: retail-jkommerce-poc

      - name: Check for Changes
        id: check
        run: |
          git fetch --tags 2>/dev/null || true
          BRANCH="${{ needs.setup.outputs.branch }}"
          CHANGED=""

          if git rev-parse --verify "origin/$BRANCH" >/dev/null 2>&1; then
            ORIGIN_SHA=$(git rev-parse "origin/$BRANCH")
            HEAD_SHA=$(git rev-parse HEAD)

            if [[ "$ORIGIN_SHA" == "$HEAD_SHA" ]]; then
              CHANGED="true"
            else
              CHANGED=$(git diff --name-only "origin/$BRANCH" HEAD | \
                grep -vE '^(\.github/|README|WEBRTC_|cloudbuild)' || true)
            fi
          else
            CHANGED="true"
          fi

          if [[ -n "$CHANGED" ]]; then
            echo "✅ Changes detected, will deploy"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "⏭️  No relevant changes, skipping"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Set Image Tag
        if: steps.check.outputs.has_changes == 'true'
        run: |
          TAG=$(date +%Y%m%d-%H%M%S)
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        if: steps.check.outputs.has_changes == 'true'
        run: |
          BRANCH="${{ needs.setup.outputs.branch }}"
          AR_REGION="${{ needs.setup.outputs.artifact_registry_region }}"
          AR_REPO="${{ needs.setup.outputs.artifact_registry_repo }}"
          IMAGE_NAME="${{ needs.setup.outputs.image_name }}"
          EMOTION_DETECTION_IMAGE_NAME="${{ needs.setup.outputs.emotion_detection_image_name }}"
          IMPRESSIONS_IMAGE_NAME="${{ needs.setup.outputs.impressions_image_name }}"
          PREFERENCES_IMAGE_NAME="${{ needs.setup.outputs.preferences_image_name }}"
          TYPE_AFFINITY_IMAGE_NAME="${{ needs.setup.outputs.type_affinity_image_name }}"
          ITEM_POPULARITY_IMAGE_NAME="${{ needs.setup.outputs.item_popularity_image_name }}"

          docker build \
            -f apps/orbiee_core/Dockerfile \
            -t ${AR_REGION}-docker.pkg.dev/retail-jkommerce-poc/${AR_REPO}/${IMAGE_NAME}:${TAG} \
            .

          docker build \
            -f apps/impressions_analytics_job/Dockerfile \
            -t ${AR_REGION}-docker.pkg.dev/retail-jkommerce-poc/${AR_REPO}/${IMPRESSIONS_IMAGE_NAME}:${TAG} \
            .

          docker build \
            -f apps/affinity_learning_service/Dockerfile \
            -t ${AR_REGION}-docker.pkg.dev/retail-jkommerce-poc/${AR_REPO}/${PREFERENCES_IMAGE_NAME}:${TAG} \
            .

          docker build \
            -f apps/type_affinity_refresh_job/Dockerfile \
            -t ${AR_REGION}-docker.pkg.dev/retail-jkommerce-poc/${AR_REPO}/${TYPE_AFFINITY_IMAGE_NAME}:${TAG} \
            .

          docker build \
            -f apps/item_popularity_refresh_job/Dockerfile \
            -t ${AR_REGION}-docker.pkg.dev/retail-jkommerce-poc/${AR_REPO}/${ITEM_POPULARITY_IMAGE_NAME}:${TAG} \
            .

          gcloud auth configure-docker ${AR_REGION}-docker.pkg.dev --quiet
          docker push ${AR_REGION}-docker.pkg.dev/retail-jkommerce-poc/${AR_REPO}/${IMAGE_NAME}:${TAG}
          docker push ${AR_REGION}-docker.pkg.dev/retail-jkommerce-poc/${AR_REPO}/${IMPRESSIONS_IMAGE_NAME}:${TAG}
          docker push ${AR_REGION}-docker.pkg.dev/retail-jkommerce-poc/${AR_REPO}/${PREFERENCES_IMAGE_NAME}:${TAG}
          docker push ${AR_REGION}-docker.pkg.dev/retail-jkommerce-poc/${AR_REPO}/${TYPE_AFFINITY_IMAGE_NAME}:${TAG}
          docker push ${AR_REGION}-docker.pkg.dev/retail-jkommerce-poc/${AR_REPO}/${ITEM_POPULARITY_IMAGE_NAME}:${TAG}
          
          if [ "${{ github.event.client_payload.deploy_emotion_detection }}" = "yes" ]; then
            docker build \
              -f apps/emotion_detection_service/Dockerfile \
              -t ${AR_REGION}-docker.pkg.dev/retail-jkommerce-poc/${AR_REPO}/${EMOTION_DETECTION_IMAGE_NAME}:${TAG} \
              apps/emotion_detection_service

            docker push ${AR_REGION}-docker.pkg.dev/retail-jkommerce-poc/${AR_REPO}/${EMOTION_DETECTION_IMAGE_NAME}:${TAG}
          fi

      - name: Deploy to Cloud Run
        if: steps.check.outputs.has_changes == 'true'
        run: |
          CLOUD_RUN_SERVICE="${{ needs.setup.outputs.cloud_run_service }}"
          CLOUD_WORKER_SERVICE="${{ needs.setup.outputs.cloud_worker_service }}"
          EMOTION_DETECTION_SERVICE="${{ needs.setup.outputs.emotion_detection_service }}"
          REGION="${{ needs.setup.outputs.region }}"
          AR_REGION="${{ needs.setup.outputs.artifact_registry_region }}"
          AR_REPO="${{ needs.setup.outputs.artifact_registry_repo }}"
          IMAGE_NAME="${{ needs.setup.outputs.image_name }}"
          EMOTION_DETECTION_IMAGE_NAME="${{ needs.setup.outputs.emotion_detection_image_name }}"
          IMPRESSIONS_IMAGE_NAME="${{ needs.setup.outputs.impressions_image_name }}"
          PREFERENCES_IMAGE_NAME="${{ needs.setup.outputs.preferences_image_name }}"
          TYPE_AFFINITY_IMAGE_NAME="${{ needs.setup.outputs.type_affinity_image_name }}"
          ITEM_POPULARITY_IMAGE_NAME="${{ needs.setup.outputs.item_popularity_image_name }}"
          ENVIRONMENT="${{ needs.setup.outputs.environment }}"

          echo "Deploying for env: $ENVIRONMENT"

          if [ "$ENVIRONMENT" = "dev" ]; then
            SECRETS="DB_CONFIG=orbiee-db-config:latest,API_KEYS_JSON=orbiee-api-keys:latest,REDIS_URL=orbiee-redis-url:latest,ORBIEE_SEARCH_BACKEND=orbiee-search-backend:latest"
          else
            SECRETS="DB_CONFIG=orbiee-db-config-demo:latest,API_KEYS_JSON=orbiee-api-keys:latest,REDIS_URL=orbiee-demo-redis-url:latest,ORBIEE_SEARCH_BACKEND=orbiee-search-backend-demo:latest"
          fi

          echo "Secrets: $SECRETS"

          gcloud run deploy ${CLOUD_RUN_SERVICE} \
            --image=${AR_REGION}-docker.pkg.dev/retail-jkommerce-poc/${AR_REPO}/${IMAGE_NAME}:${TAG} \
            --platform=managed \
            --memory=2Gi \
            --region=${REGION} \
            --timeout=3600 \
            --set-secrets=${SECRETS} \
            --set-env-vars="ORBIEE_GCP_PROJECT=retail-jkommerce-poc,ORBIEE_DEBUG=false,VERTEX_PROJECT=218142584790,RETAIL_PLACEMENT=projects/218142584790/locations/global/catalogs/default_catalog/servingConfigs/recommenedfy,RETAIL_BRANCH=projects/218142584790/locations/global/catalogs/default_catalog/branches/2,RETAIL_SEARCH_PLACEMENT=projects/218142584790/locations/global/catalogs/default_catalog/placements/default_search,ORBIEE_EMOTION_SERVICE_URL=https://${EMOTION_DETECTION_SERVICE}-218142584790.us-central1.run.app" \
            --quiet

          gcloud run deploy ${CLOUD_WORKER_SERVICE} \
            --image=${AR_REGION}-docker.pkg.dev/retail-jkommerce-poc/${AR_REPO}/${IMAGE_NAME}:${TAG} \
            --platform=managed \
            --memory=2Gi \
            --region=${REGION} \
            --set-secrets=${SECRETS} \
            --set-env-vars="ORBIEE_GCP_PROJECT=retail-jkommerce-poc,ORBIEE_DEBUG=false,VERTEX_PROJECT=218142584790,RETAIL_PLACEMENT=projects/218142584790/locations/global/catalogs/default_catalog/servingConfigs/recommenedfy,RETAIL_BRANCH=projects/218142584790/locations/global/catalogs/default_catalog/branches/2,RETAIL_SEARCH_PLACEMENT=projects/218142584790/locations/global/catalogs/default_catalog/placements/default_search" \
            --command=python \
            --args=-m,orbiee.workers.session_worker \
            --min-instances=1 \
            --max-instances=1 \
            --quiet

          gcloud run services add-iam-policy-binding ${CLOUD_RUN_SERVICE} \
            --region=${REGION} \
            --member="serviceAccount:218142584790-compute@developer.gserviceaccount.com" \
            --role="roles/run.invoker"

          gcloud run services add-iam-policy-binding ${CLOUD_WORKER_SERVICE} \
            --region=${REGION} \
            --member="serviceAccount:218142584790-compute@developer.gserviceaccount.com" \
            --role="roles/run.invoker"

          if [ "${{ github.event.client_payload.deploy_emotion_detection }}" = "yes" ]; then
            gcloud run deploy ${EMOTION_DETECTION_SERVICE} \
              --image=${AR_REGION}-docker.pkg.dev/retail-jkommerce-poc/${AR_REPO}/${EMOTION_DETECTION_IMAGE_NAME}:${TAG} \
              --platform=managed \
              --cpu=4 \
              --memory=8Gi \
              --region=${REGION} \
              --set-secrets=${SECRETS} \
              --set-env-vars="EMOTION_MODEL_HUB=hf" \
              --min-instances=1 \
              --max-instances=1 \
              --quiet

            gcloud run services add-iam-policy-binding ${EMOTION_DETECTION_SERVICE} \
              --region=${REGION} \
              --member="serviceAccount:218142584790-compute@developer.gserviceaccount.com" \
              --role="roles/run.invoker"
          fi

          if gcloud run jobs describe ${IMPRESSIONS_IMAGE_NAME} --region=${REGION} >/dev/null 2>&1; then
            echo "Updating existing job..."
            gcloud run jobs update ${IMPRESSIONS_IMAGE_NAME} \
              --image=${AR_REGION}-docker.pkg.dev/retail-jkommerce-poc/${AR_REPO}/${IMPRESSIONS_IMAGE_NAME}:${TAG} \
              --region=${REGION} \
              --set-secrets=${SECRETS} \
              --max-retries=1 \
              --service-account="218142584790-compute@developer.gserviceaccount.com" \
              --task-timeout=15m
          else
            echo "Creating new job..."
            gcloud run jobs create ${IMPRESSIONS_IMAGE_NAME} \
              --image=${AR_REGION}-docker.pkg.dev/retail-jkommerce-poc/${AR_REPO}/${IMPRESSIONS_IMAGE_NAME}:${TAG} \
              --region=${REGION} \
              --set-secrets=${SECRETS} \
              --max-retries=1 \
              --service-account="218142584790-compute@developer.gserviceaccount.com" \
              --task-timeout=15m
          fi

          gcloud run jobs add-iam-policy-binding ${IMPRESSIONS_IMAGE_NAME} \
              --region=${REGION} \
              --member="serviceAccount:218142584790-compute@developer.gserviceaccount.com" \
              --role="roles/run.invoker"

          if gcloud scheduler jobs describe ${IMPRESSIONS_IMAGE_NAME}-weekly --location=${REGION} >/dev/null 2>&1; then
            echo "Updating existing job scheduler..."
            gcloud scheduler jobs update http ${IMPRESSIONS_IMAGE_NAME}-weekly \
              --location=${REGION} \
              --schedule="0 6 * * 1" \
              --uri="https://run.googleapis.com/v2/projects/retail-jkommerce-poc/locations/${REGION}/jobs/${IMPRESSIONS_IMAGE_NAME}:run" \
              --http-method=POST \
              --oauth-service-account-email="218142584790-compute@developer.gserviceaccount.com" \
              --oauth-token-scope="https://www.googleapis.com/auth/cloud-platform"
          else
            echo "Creating new job scheduler..."
            gcloud scheduler jobs create http ${IMPRESSIONS_IMAGE_NAME}-weekly \
              --location=${REGION} \
              --schedule="0 6 * * 1" \
              --uri="https://run.googleapis.com/v2/projects/retail-jkommerce-poc/locations/${REGION}/jobs/${IMPRESSIONS_IMAGE_NAME}:run" \
              --http-method=POST \
              --oauth-service-account-email="218142584790-compute@developer.gserviceaccount.com" \
              --oauth-token-scope="https://www.googleapis.com/auth/cloud-platform"
          fi

          if gcloud run jobs describe ${PREFERENCES_IMAGE_NAME} --region=${REGION} >/dev/null 2>&1; then
            echo "Updating existing preferences job..."
            gcloud run jobs update ${PREFERENCES_IMAGE_NAME} \
              --image=${AR_REGION}-docker.pkg.dev/retail-jkommerce-poc/${AR_REPO}/${PREFERENCES_IMAGE_NAME}:${TAG} \
              --region=${REGION} \
              --set-secrets=${SECRETS} \
              --max-retries=1 \
              --service-account="218142584790-compute@developer.gserviceaccount.com" \
              --task-timeout=15m
          else
            echo "Creating new preferences job..."
            gcloud run jobs create ${PREFERENCES_IMAGE_NAME} \
              --image=${AR_REGION}-docker.pkg.dev/retail-jkommerce-poc/${AR_REPO}/${PREFERENCES_IMAGE_NAME}:${TAG} \
              --region=${REGION} \
              --set-secrets=${SECRETS} \
              --max-retries=1 \
              --service-account="218142584790-compute@developer.gserviceaccount.com" \
              --task-timeout=15m
          fi

          gcloud run jobs add-iam-policy-binding ${PREFERENCES_IMAGE_NAME} \
              --region=${REGION} \
              --member="serviceAccount:218142584790-compute@developer.gserviceaccount.com" \
              --role="roles/run.invoker"

          if gcloud scheduler jobs describe ${PREFERENCES_IMAGE_NAME}-weekly --location=${REGION} >/dev/null 2>&1; then
            echo "Updating existing preferences job scheduler..."
            gcloud scheduler jobs update http ${PREFERENCES_IMAGE_NAME}-weekly \
              --location=${REGION} \
              --schedule="0 8 * * 1" \
              --uri="https://run.googleapis.com/v2/projects/retail-jkommerce-poc/locations/${REGION}/jobs/${PREFERENCES_IMAGE_NAME}:run" \
              --http-method=POST \
              --oauth-service-account-email="218142584790-compute@developer.gserviceaccount.com" \
              --oauth-token-scope="https://www.googleapis.com/auth/cloud-platform"
          else
            echo "Creating new preferences job scheduler..."
            gcloud scheduler jobs create http ${PREFERENCES_IMAGE_NAME}-weekly \
              --location=${REGION} \
              --schedule="0 8 * * 1" \
              --uri="https://run.googleapis.com/v2/projects/retail-jkommerce-poc/locations/${REGION}/jobs/${PREFERENCES_IMAGE_NAME}:run" \
              --http-method=POST \
              --oauth-service-account-email="218142584790-compute@developer.gserviceaccount.com" \
              --oauth-token-scope="https://www.googleapis.com/auth/cloud-platform"
          fi

          # ── type_affinity refresh job (weekly, Mon 04:00) ──────────────────
          if gcloud run jobs describe ${TYPE_AFFINITY_IMAGE_NAME} --region=${REGION} >/dev/null 2>&1; then
            echo "Updating existing type_affinity job..."
            gcloud run jobs update ${TYPE_AFFINITY_IMAGE_NAME} \
              --image=${AR_REGION}-docker.pkg.dev/retail-jkommerce-poc/${AR_REPO}/${TYPE_AFFINITY_IMAGE_NAME}:${TAG} \
              --region=${REGION} \
              --set-secrets=${SECRETS} \
              --max-retries=1 \
              --service-account="218142584790-compute@developer.gserviceaccount.com" \
              --task-timeout=15m
          else
            echo "Creating new type_affinity job..."
            gcloud run jobs create ${TYPE_AFFINITY_IMAGE_NAME} \
              --image=${AR_REGION}-docker.pkg.dev/retail-jkommerce-poc/${AR_REPO}/${TYPE_AFFINITY_IMAGE_NAME}:${TAG} \
              --region=${REGION} \
              --set-secrets=${SECRETS} \
              --max-retries=1 \
              --service-account="218142584790-compute@developer.gserviceaccount.com" \
              --task-timeout=15m
          fi

          gcloud run jobs add-iam-policy-binding ${TYPE_AFFINITY_IMAGE_NAME} \
              --region=${REGION} \
              --member="serviceAccount:218142584790-compute@developer.gserviceaccount.com" \
              --role="roles/run.invoker"

          if gcloud scheduler jobs describe ${TYPE_AFFINITY_IMAGE_NAME}-weekly --location=${REGION} >/dev/null 2>&1; then
            echo "Updating existing type_affinity job scheduler..."
            gcloud scheduler jobs update http ${TYPE_AFFINITY_IMAGE_NAME}-weekly \
              --location=${REGION} \
              --schedule="0 4 * * 1" \
              --uri="https://run.googleapis.com/v2/projects/retail-jkommerce-poc/locations/${REGION}/jobs/${TYPE_AFFINITY_IMAGE_NAME}:run" \
              --http-method=POST \
              --oauth-service-account-email="218142584790-compute@developer.gserviceaccount.com" \
              --oauth-token-scope="https://www.googleapis.com/auth/cloud-platform"
          else
            echo "Creating new type_affinity job scheduler..."
            gcloud scheduler jobs create http ${TYPE_AFFINITY_IMAGE_NAME}-weekly \
              --location=${REGION} \
              --schedule="0 4 * * 1" \
              --uri="https://run.googleapis.com/v2/projects/retail-jkommerce-poc/locations/${REGION}/jobs/${TYPE_AFFINITY_IMAGE_NAME}:run" \
              --http-method=POST \
              --oauth-service-account-email="218142584790-compute@developer.gserviceaccount.com" \
              --oauth-token-scope="https://www.googleapis.com/auth/cloud-platform"
          fi

          # ── item_popularity refresh job (weekly, Mon 05:00) ────────────────
          if gcloud run jobs describe ${ITEM_POPULARITY_IMAGE_NAME} --region=${REGION} >/dev/null 2>&1; then
            echo "Updating existing item_popularity job..."
            gcloud run jobs update ${ITEM_POPULARITY_IMAGE_NAME} \
              --image=${AR_REGION}-docker.pkg.dev/retail-jkommerce-poc/${AR_REPO}/${ITEM_POPULARITY_IMAGE_NAME}:${TAG} \
              --region=${REGION} \
              --set-secrets=${SECRETS} \
              --max-retries=1 \
              --service-account="218142584790-compute@developer.gserviceaccount.com" \
              --task-timeout=15m
          else
            echo "Creating new item_popularity job..."
            gcloud run jobs create ${ITEM_POPULARITY_IMAGE_NAME} \
              --image=${AR_REGION}-docker.pkg.dev/retail-jkommerce-poc/${AR_REPO}/${ITEM_POPULARITY_IMAGE_NAME}:${TAG} \
              --region=${REGION} \
              --set-secrets=${SECRETS} \
              --max-retries=1 \
              --service-account="218142584790-compute@developer.gserviceaccount.com" \
              --task-timeout=15m
          fi

          gcloud run jobs add-iam-policy-binding ${ITEM_POPULARITY_IMAGE_NAME} \
              --region=${REGION} \
              --member="serviceAccount:218142584790-compute@developer.gserviceaccount.com" \
              --role="roles/run.invoker"

          if gcloud scheduler jobs describe ${ITEM_POPULARITY_IMAGE_NAME}-weekly --location=${REGION} >/dev/null 2>&1; then
            echo "Updating existing item_popularity job scheduler..."
            gcloud scheduler jobs update http ${ITEM_POPULARITY_IMAGE_NAME}-weekly \
              --location=${REGION} \
              --schedule="0 5 * * 1" \
              --uri="https://run.googleapis.com/v2/projects/retail-jkommerce-poc/locations/${REGION}/jobs/${ITEM_POPULARITY_IMAGE_NAME}:run" \
              --http-method=POST \
              --oauth-service-account-email="218142584790-compute@developer.gserviceaccount.com" \
              --oauth-token-scope="https://www.googleapis.com/auth/cloud-platform"
          else
            echo "Creating new item_popularity job scheduler..."
            gcloud scheduler jobs create http ${ITEM_POPULARITY_IMAGE_NAME}-weekly \
              --location=${REGION} \
              --schedule="0 5 * * 1" \
              --uri="https://run.googleapis.com/v2/projects/retail-jkommerce-poc/locations/${REGION}/jobs/${ITEM_POPULARITY_IMAGE_NAME}:run" \
              --http-method=POST \
              --oauth-service-account-email="218142584790-compute@developer.gserviceaccount.com" \
              --oauth-token-scope="https://www.googleapis.com/auth/cloud-platform"
          fi

          echo ""
          echo "✅ Deployed: $CLOUD_RUN_SERVICE"
          echo "🌍 URL: $(gcloud run services describe ${CLOUD_RUN_SERVICE} \
            --region=${REGION} --format='value(status.url)')"

  deploy-frontend:
    if: ${{ github.event.client_payload.repository == 'orbiee-jktech/Orbiee_FrontEnd' }}
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repository }}
          ref: ${{ github.event.client_payload.ref }}
          token: ${{ secrets.PRIVATETOKENPULL }}
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SAKEY }}"

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: retail-jkommerce-poc

      - name: Check for Changes
        id: check
        run: |
          git fetch --tags 2>/dev/null || true
          BRANCH="${{ needs.setup.outputs.branch }}"
          CHANGED=""

          if git rev-parse --verify "origin/$BRANCH" >/dev/null 2>&1; then
            ORIGIN_SHA=$(git rev-parse "origin/$BRANCH")
            HEAD_SHA=$(git rev-parse HEAD)

            if [[ "$ORIGIN_SHA" == "$HEAD_SHA" ]]; then
              CHANGED="true"
            else
              CHANGED=$(git diff --name-only "origin/$BRANCH" HEAD | \
                grep -vE '^(\.github/|README|WEBRTC_|cloudbuild)' || true)
            fi
          else
            CHANGED="true"
          fi

          if [[ -n "$CHANGED" ]]; then
            echo "✅ Changes detected, will deploy"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "⏭️  No relevant changes, skipping"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Set Image Tag
        if: steps.check.outputs.has_changes == 'true'
        run: |
          TAG=$(date +%Y%m%d-%H%M%S)
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        if: steps.check.outputs.has_changes == 'true'
        run: |
          BRANCH="${{ needs.setup.outputs.branch }}"
          AR_REGION="${{ needs.setup.outputs.artifact_registry_region }}"
          AR_REPO="${{ needs.setup.outputs.artifact_registry_repo }}"
          IMAGE_NAME="${{ needs.setup.outputs.image_name }}"
          REACT_APP_ENV="dev"

          # case "$BRANCH" in
          #   dev|rearchitecture)  REACT_APP_ENV="dev" ;;
          #   demov1|rearchitecture_demo) REACT_APP_ENV="demov1"        ;;
          # esac

          docker build \
            --build-arg REACT_APP_ENV=${REACT_APP_ENV} \
            -t ${AR_REGION}-docker.pkg.dev/retail-jkommerce-poc/${AR_REPO}/${IMAGE_NAME}:${TAG} \
            .

          gcloud auth configure-docker ${AR_REGION}-docker.pkg.dev --quiet
          docker push ${AR_REGION}-docker.pkg.dev/retail-jkommerce-poc/${AR_REPO}/${IMAGE_NAME}:${TAG}

      - name: Deploy to Cloud Run
        if: steps.check.outputs.has_changes == 'true'
        run: |
          CLOUD_RUN_SERVICE="${{ needs.setup.outputs.cloud_run_service }}"
          REGION="${{ needs.setup.outputs.region }}"
          AR_REGION="${{ needs.setup.outputs.artifact_registry_region }}"
          AR_REPO="${{ needs.setup.outputs.artifact_registry_repo }}"
          IMAGE_NAME="${{ needs.setup.outputs.image_name }}"

          gcloud run deploy ${CLOUD_RUN_SERVICE} \
            --image=${AR_REGION}-docker.pkg.dev/retail-jkommerce-poc/${AR_REPO}/${IMAGE_NAME}:${TAG} \
            --platform=managed \
            --region=${REGION} \
            --allow-unauthenticated \
            --quiet

          echo ""
          echo "✅ Deployed: $CLOUD_RUN_SERVICE"
          echo "🌍 URL: $(gcloud run services describe ${CLOUD_RUN_SERVICE} \
            --region=${REGION} --format='value(status.url)')"
